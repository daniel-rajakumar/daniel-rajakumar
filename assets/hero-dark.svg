<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Daniel Rajakumar, software engineer">
  <title>Daniel Rajakumar</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D2D2E"/><stop offset="1" stop-color="#202022"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#383838"/><stop offset="0.5" stop-color="#383838" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1DB954"/><stop offset="1" stop-color="#279B59"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1DB954" stop-opacity="0.3"/><stop offset="1" stop-color="#1DB954" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#202022"/><stop offset="0.45" stop-color="#202022" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202022"/><stop offset="0.4" stop-color="#202022" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="inner"><rect x="16" y="16" width="1168" height="368" rx="20"/></clipPath>
    <style>
      .grid line { stroke: #1DB954; stroke-opacity: 0.22; stroke-width: 1; }
      .floor { animation: roll 1.8s linear infinite; }
      @keyframes roll { from { transform: translateY(0) } to { transform: translateY(12px) } }
      .glow { animation: breathe 6s ease-in-out infinite; transform-origin: 900px 260px; }
      @keyframes breathe { 0%,100% { opacity: .75; transform: scale(1) } 50% { opacity: 1; transform: scale(1.06) } }
      .hello { font: 500 18px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #8A8A8A; letter-spacing: 3px; }
      .name { font: 600 60px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #FAFAFA; letter-spacing: .5px; }
      .bar { fill: url(#bar); animation: grow 3s ease-out infinite alternate; transform-origin: 64px 0; }
      @keyframes grow { from { transform: scaleX(.55) } to { transform: scaleX(1) } }
      .role { font: 400 26px 'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #D6D6D6; }
      .prompt { font: 600 26px 'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #1DB954; }
      .cursor { fill: #1DB954; }
      .pill { fill: #1E1E1F; stroke: #1DB954; stroke-opacity: .45; }
      .pilltext { font: 500 15px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1DB954; }
      .dot { fill: #1DB954; }
      .ping { fill: #1DB954; transform-origin: 86px 318px; animation: ping 1.8s ease-out infinite; }
      @keyframes ping { from { transform: scale(1); opacity: .6 } to { transform: scale(2.8); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect x="16" y="16" width="1168" height="368" rx="20" fill="url(#card)"/>
  <g clip-path="url(#inner)">
    <circle class="glow" cx="900" cy="260" r="230" fill="url(#sun)"/>
    <g class="grid"><g class="floor"><line x1="560" y1="261.4" x2="1180" y2="261.4"/><line x1="560" y1="265.6" x2="1180" y2="265.6"/><line x1="560" y1="272.6" x2="1180" y2="272.6"/><line x1="560" y1="282.4" x2="1180" y2="282.4"/><line x1="560" y1="295.0" x2="1180" y2="295.0"/><line x1="560" y1="310.4" x2="1180" y2="310.4"/><line x1="560" y1="328.6" x2="1180" y2="328.6"/><line x1="560" y1="349.6" x2="1180" y2="349.6"/><line x1="560" y1="373.4" x2="1180" y2="373.4"/><line x1="560" y1="400.0" x2="1180" y2="400.0"/><line x1="560" y1="429.4" x2="1180" y2="429.4"/><line x1="900" y1="260" x2="90" y2="440"/><line x1="900" y1="260" x2="180" y2="440"/><line x1="900" y1="260" x2="270" y2="440"/><line x1="900" y1="260" x2="360" y2="440"/><line x1="900" y1="260" x2="450" y2="440"/><line x1="900" y1="260" x2="540" y2="440"/><line x1="900" y1="260" x2="630" y2="440"/><line x1="900" y1="260" x2="720" y2="440"/><line x1="900" y1="260" x2="810" y2="440"/><line x1="900" y1="260" x2="900" y2="440"/><line x1="900" y1="260" x2="990" y2="440"/><line x1="900" y1="260" x2="1080" y2="440"/><line x1="900" y1="260" x2="1170" y2="440"/><line x1="900" y1="260" x2="1260" y2="440"/><line x1="900" y1="260" x2="1350" y2="440"/><line x1="900" y1="260" x2="1440" y2="440"/><line x1="900" y1="260" x2="1530" y2="440"/><line x1="900" y1="260" x2="1620" y2="440"/><line x1="900" y1="260" x2="1710" y2="440"/></g></g>
    <rect x="16" y="16" width="1168" height="368" fill="url(#fadeL)"/>
  </g>
  <rect x="16.5" y="16.5" width="1167" height="367" rx="20" fill="none" stroke="url(#edge)"/>

  <text class="hello" x="64" y="92">HI, I'M</text>
  <text class="name" x="62" y="160">Daniel Rajakumar</text>
  <rect class="bar" x="64" y="180" width="64" height="6" rx="3"/>

  <g transform="translate(64 246)">
    <text class="prompt" x="0" y="0">&gt;</text>
    <g transform="translate(30 0)">
    <clipPath id="clip0"><rect x="0" y="-40" height="60" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.0750;0.1875;0.2250;0.2500;1.0000" values="0;269.2;269.2;0;0;0"/>
    </rect></clipPath>
    <g clip-path="url(#clip0)"><text class="role" x="0" y="0">Software Engineer</text></g>
    <rect class="cursor" x="0" y="-23" width="3" height="29" opacity="0">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.0750;0.1875;0.2250;0.2500;1.0000" values="0;269.2;269.2;0;0;0"/>
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.0000;0.2500" values="0;1;0"/>
    </rect>
    <clipPath id="clip1"><rect x="0" y="-40" height="60" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.2500;0.3250;0.4375;0.4750;0.5000;1.0000" values="0;0;269.2;269.2;0;0;0"/>
    </rect></clipPath>
    <g clip-path="url(#clip1)"><text class="role" x="0" y="0">Building RockyGPT</text></g>
    <rect class="cursor" x="0" y="-23" width="3" height="29" opacity="0">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.2500;0.3250;0.4375;0.4750;0.5000;1.0000" values="0;0;269.2;269.2;0;0;0"/>
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.2500;0.5000" values="0;1;0"/>
    </rect>
    <clipPath id="clip2"><rect x="0" y="-40" height="60" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.5000;0.5750;0.6875;0.7250;0.7500;1.0000" values="0;0;394.0;394.0;0;0;0"/>
    </rect></clipPath>
    <g clip-path="url(#clip2)"><text class="role" x="0" y="0">Retrieval systems + evals</text></g>
    <rect class="cursor" x="0" y="-23" width="3" height="29" opacity="0">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.5000;0.5750;0.6875;0.7250;0.7500;1.0000" values="0;0;394.0;394.0;0;0;0"/>
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.5000;0.7500" values="0;1;0"/>
    </rect>
    <clipPath id="clip3"><rect x="0" y="-40" height="60" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.7500;0.8250;0.9375;0.9750;1.0000" values="0;0;456.4;456.4;0;0"/>
    </rect></clipPath>
    <g clip-path="url(#clip3)"><text class="role" x="0" y="0">Next.js · TypeScript · Python</text></g>
    <rect class="cursor" x="0" y="-23" width="3" height="29" opacity="0">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.7500;0.8250;0.9375;0.9750;1.0000" values="0;0;456.4;456.4;0;0"/>
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.7500;1.0000" values="0;1;0"/>
    </rect>
    </g>
  </g>

  <rect class="pill" x="64" y="298" width="296" height="40" rx="20"/>
  <circle class="ping" cx="86" cy="318" r="5"/>
  <circle class="dot" cx="86" cy="318" r="5"/>
  <text class="pilltext" x="102" y="323">Open to New Grad SWE Roles</text>
</svg>
