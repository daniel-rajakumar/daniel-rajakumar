<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 236" width="420" height="236" role="img" aria-label="Bubble PoppAR: Runner-up · HackRamapo 2026">
  <title>Bubble PoppAR</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <style>
      .name { font: 600 22px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #121212; }
      .tagline { font: 500 13px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #16A34A; }
      .about { font: 400 14px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #3F3F46; }
      .tag { fill: #000000; fill-opacity: 0.032; stroke: #000000; stroke-opacity: 0.1; }
      .tagtext { font: 500 12px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #3F3F46; }
      .livetext { font: 500 12px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #16A34A; }
      .dot { fill: #16A34A; }
      .ping { fill: #16A34A; transform-origin: 378px 38px; animation: ping 1.8s ease-out infinite; }
      @keyframes ping { from { transform: scale(1); opacity: .6 } to { transform: scale(2.8); opacity: 0 } }
      .bar { fill: url(#bar); animation: grow 3s ease-out infinite alternate; transform-origin: 28px 0; }
      @keyframes grow { from { transform: scaleX(.55) } to { transform: scaleX(1) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="4.5" y="4.5" width="411" height="227" rx="18" fill="#000000" fill-opacity="0.02" stroke="#000000" stroke-opacity="0.1"/>
  <text class="name" x="28" y="46">Bubble PoppAR</text>
  
  <text class="tagline" x="28" y="70">Runner-up · HackRamapo 2026</text>
  <rect class="bar" x="28" y="82" width="36" height="4" rx="2"/>
  <text class="about" x="28" y="112">Two-player webcam game you play with hand and eye</text><text class="about" x="28" y="133">gestures, with real-time matches and server-checked</text><text class="about" x="28" y="154">scoring.</text>
  <rect class="tag" x="28" y="186" width="93" height="26" rx="13"/><text class="tagtext" x="74.5" y="203.5" text-anchor="middle">TypeScript</text><rect class="tag" x="129" y="186" width="86" height="26" rx="13"/><text class="tagtext" x="172" y="203.5" text-anchor="middle">MediaPipe</text><rect class="tag" x="223" y="186" width="79" height="26" rx="13"/><text class="tagtext" x="262.5" y="203.5" text-anchor="middle">Three.js</text><rect class="tag" x="310" y="186" width="86" height="26" rx="13"/><text class="tagtext" x="353" y="203.5" text-anchor="middle">Socket.IO</text>
