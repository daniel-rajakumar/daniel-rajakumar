<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 92" width="300" height="92" role="img" aria-label="danielrajakumar.com">
  <title>danielrajakumar.com</title>
  <defs>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glassSpec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <mask id="glassOutside">
      <rect x="-5000" y="-5000" width="10000" height="10000" fill="#FFF"/>
      <rect x="10" y="8" width="280" height="66" rx="33" fill="#000"/>
    </mask>
    <clipPath id="glassClip"><rect x="10" y="8" width="280" height="66" rx="33"/></clipPath>
    <style>
      .sheen { animation: sheen 9s ease-in-out infinite; animation-delay: 0s; }
      @keyframes sheen { 0%, 55% { transform: translateX(-280px) } 100% { transform: translateX(280px) } }
      .label { font: 600 21px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #121212; }
      .dot { fill: #16A34A; }
      .ping { fill: #16A34A; animation: ping 1.8s ease-out infinite; }
      @keyframes ping { from { transform: scale(1); opacity: .6 } to { transform: scale(2.6); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="10" y="14" width="280" height="66" rx="33" fill="#000" fill-opacity="0.12" filter="url(#glassShadow)" mask="url(#glassOutside)"/>
  <rect x="10" y="8" width="280" height="66" rx="33" fill="url(#glassFill)"/>
  <g clip-path="url(#glassClip)"><rect class="sheen" x="10" y="8" width="280" height="66" fill="url(#glassSheen)"/></g>
  <circle cx="34.75" cy="41" r="9" fill="none" stroke="#16A34A" stroke-width="2"/><ellipse cx="34.75" cy="41" rx="4" ry="9" fill="none" stroke="#16A34A" stroke-width="1.6"/><line x1="25.75" y1="41" x2="43.75" y2="41" stroke="#16A34A" stroke-width="1.6"/>
  <text class="label" x="56.75" y="48">danielrajakumar.com</text>
  <rect x="10.5" y="8.5" width="279" height="65" rx="33" fill="none" stroke="url(#glassEdge)"/>
  <rect x="43" y="8.5" width="214" height="1" fill="url(#glassSpec)"/>
</svg>
