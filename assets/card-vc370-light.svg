<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 236" width="420" height="236" role="img" aria-label="VC370: Assembler and emulator">
  <title>VC370</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F7F8"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4E4E7"/><stop offset="0.5" stop-color="#E4E4E7" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <style>
      .name { font: 600 22px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #121212; }
      .tagline { font: 500 13px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #16A34A; }
      .about { font: 400 14px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #3F3F46; }
      .tag { fill: #F0FDF4; stroke: #E4E4E7; }
      .tagtext { font: 500 12px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #3F3F46; }
      .livetext { font: 500 12px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #16A34A; }
      .dot { fill: #16A34A; }
      .ping { fill: #16A34A; transform-origin: 378px 38px; animation: ping 1.8s ease-out infinite; }
      @keyframes ping { from { transform: scale(1); opacity: .6 } to { transform: scale(2.8); opacity: 0 } }
      .bar { fill: url(#bar); animation: grow 3s ease-out infinite alternate; transform-origin: 28px 0; }
      @keyframes grow { from { transform: scaleX(.55) } to { transform: scaleX(1) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="4" y="4" width="412" height="228" rx="18" fill="url(#card)"/>
  <rect x="4.5" y="4.5" width="411" height="227" rx="18" fill="none" stroke="url(#edge)"/>
  <text class="name" x="28" y="46">VC370</text>
  
  <text class="tagline" x="28" y="70">Assembler and emulator</text>
  <rect class="bar" x="28" y="82" width="36" height="4" rx="2"/>
  <text class="about" x="28" y="112">Two-pass assembler and emulator for a 13-opcode</text><text class="about" x="28" y="133">simulated computer, with assemble-time and runtime</text><text class="about" x="28" y="154">error checks.</text>
  <rect class="tag" x="28" y="186" width="58" height="26" rx="13"/><text class="tagtext" x="57" y="203.5" text-anchor="middle">C++17</text><rect class="tag" x="94" y="186" width="50" height="26" rx="13"/><text class="tagtext" x="119" y="203.5" text-anchor="middle">Make</text>
</svg>
