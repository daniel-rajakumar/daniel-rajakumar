<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 294" width="1200" height="294" role="img" aria-label="About me">
  <title>About me</title>
  <defs>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.225"/>
    </linearGradient>
    <linearGradient id="glassSpec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <mask id="glassOutside">
      <rect x="-5000" y="-5000" width="10000" height="10000" fill="#FFF"/>
      <rect x="16" y="8" width="1168" height="270" rx="24" fill="#000"/>
    </mask>
    <clipPath id="glassClip"><rect x="16" y="8" width="1168" height="270" rx="24"/></clipPath>
    <style>
      .sheen { animation: sheen 9s ease-in-out infinite; animation-delay: 1s; }
      @keyframes sheen { 0%, 55% { transform: translateX(-1168px) } 100% { transform: translateX(1168px) } }
      .intro { font: 500 22px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #FAFAFA; }
      .point { font: 400 21px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #D6D6D6; }
      .emoji { font: 400 21px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; }
    </style>
  </defs>
  <rect x="16" y="14" width="1168" height="270" rx="24" fill="#000" fill-opacity="0.45" filter="url(#glassShadow)" mask="url(#glassOutside)"/>
  <rect x="16" y="8" width="1168" height="270" rx="24" fill="url(#glassFill)"/>
  <g clip-path="url(#glassClip)"><rect class="sheen" x="16" y="8" width="1168" height="270" fill="url(#glassSheen)"/></g>
  <text class="intro" x="54" y="62">I build full-stack web apps in TypeScript and Next.js, lately with a focus on retrieval systems and</text><text class="intro" x="54" y="92">the tests that keep them honest.</text><text class="emoji" x="54" y="136">🎓</text><text class="point" x="92" y="136">B.S. in Computer Science, Ramapo College of New Jersey (2026)</text><text class="emoji" x="54" y="174">💼</text><text class="point" x="92" y="174">Software engineering intern at dsm-firmenich, where I built and launched an internal</text><text class="point" x="92" y="204">assessment platform as the sole developer</text><text class="emoji" x="54" y="242">🤖</text><text class="point" x="92" y="242">Building RockyGPT, a campus assistant for Ramapo that answers with linked sources</text>
  <rect x="16.5" y="8.5" width="1167" height="269" rx="24" fill="none" stroke="url(#glassEdge)"/>
  <rect x="40" y="8.5" width="1120" height="1" fill="url(#glassSpec)"/>
</svg>
