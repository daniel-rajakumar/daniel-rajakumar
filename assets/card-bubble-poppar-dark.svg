<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 236" width="420" height="236" role="img" aria-label="Bubble PoppAR: Runner-up · HackRamapo 2026">
  <title>Bubble PoppAR</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1DB954"/><stop offset="1" stop-color="#279B59"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.225"/>
    </linearGradient>
    <linearGradient id="glassSpec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glassShadow" x="-50%" y="-50%" width="200%" height="250%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <mask id="glassOutside" maskUnits="userSpaceOnUse" x="-5000" y="-5000" width="10000" height="10000">
      <rect x="-5000" y="-5000" width="10000" height="10000" fill="#FFF"/>
      <rect x="12" y="8" width="396" height="212" rx="20" fill="#000"/>
    </mask>
    <clipPath id="glassClip"><rect x="12" y="8" width="396" height="212" rx="20"/></clipPath>
    <style>
      .sheen { animation: sheen 9s ease-in-out infinite; animation-delay: 1.5s; }
      @keyframes sheen { 0%, 55% { transform: translateX(-396px) } 100% { transform: translateX(396px) } }
      .name { font: 600 22px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #FAFAFA; }
      .tagline { font: 500 13px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1DB954; }
      .about { font: 400 14px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #D6D6D6; }
      .tag { fill: #FFFFFF; fill-opacity: 0.056; stroke: #FFFFFF; stroke-opacity: 0.12; }
      .tagtext { font: 500 12px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #D6D6D6; }
      .livetext { font: 500 12px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1DB954; }
      .dot { fill: #1DB954; }
      .ping { fill: #1DB954; transform-origin: 382px 38px; animation: ping 1.8s ease-out infinite; }
      @keyframes ping { from { transform: scale(1); opacity: .6 } to { transform: scale(2.8); opacity: 0 } }
      .bar { fill: url(#bar); animation: grow 3s ease-out infinite alternate; transform-origin: 34px 0; }
      @keyframes grow { from { transform: scaleX(.55) } to { transform: scaleX(1) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect x="12" y="12" width="396" height="212" rx="20" fill="#000" fill-opacity="0.45" filter="url(#glassShadow)" mask="url(#glassOutside)"/>
  <rect x="12" y="8" width="396" height="212" rx="20" fill="url(#glassFill)"/>
  <g clip-path="url(#glassClip)"><rect class="sheen" x="12" y="8" width="396" height="212" fill="url(#glassSheen)"/></g>
  <text class="name" x="34" y="46">Bubble PoppAR</text>
  
  <text class="tagline" x="34" y="70">Runner-up · HackRamapo 2026</text>
  <rect class="bar" x="34" y="82" width="36" height="4" rx="2"/>
  <text class="about" x="34" y="112">Two-player webcam game you play with hand and eye</text><text class="about" x="34" y="133">gestures, with real-time matches and server-</text><text class="about" x="34" y="154">checked scoring.</text>
  <rect class="tag" x="34" y="178" width="87" height="26" rx="13"/><text class="tagtext" x="77.5" y="195.5" text-anchor="middle">TypeScript</text><rect class="tag" x="127" y="178" width="80" height="26" rx="13"/><text class="tagtext" x="167" y="195.5" text-anchor="middle">MediaPipe</text><rect class="tag" x="213" y="178" width="74" height="26" rx="13"/><text class="tagtext" x="250" y="195.5" text-anchor="middle">Three.js</text><rect class="tag" x="293" y="178" width="80" height="26" rx="13"/><text class="tagtext" x="333" y="195.5" text-anchor="middle">Socket.IO</text>

  <rect x="12.5" y="8.5" width="395" height="211" rx="20" fill="none" stroke="url(#glassEdge)"/>
  <rect x="32" y="8.5" width="356" height="1" fill="url(#glassSpec)"/>
</svg>
