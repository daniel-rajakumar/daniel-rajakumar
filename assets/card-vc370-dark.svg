<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 236" width="420" height="236" role="img" aria-label="VC370: Assembler and emulator">
  <title>VC370</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1DB954"/><stop offset="1" stop-color="#279B59"/>
    </linearGradient>
    <style>
      .name { font: 600 22px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #FAFAFA; }
      .tagline { font: 500 13px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1DB954; }
      .about { font: 400 14px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #D6D6D6; }
      .tag { fill: #FFFFFF; fill-opacity: 0.056; stroke: #FFFFFF; stroke-opacity: 0.12; }
      .tagtext { font: 500 12px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #D6D6D6; }
      .livetext { font: 500 12px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1DB954; }
      .dot { fill: #1DB954; }
      .ping { fill: #1DB954; transform-origin: 378px 38px; animation: ping 1.8s ease-out infinite; }
      @keyframes ping { from { transform: scale(1); opacity: .6 } to { transform: scale(2.8); opacity: 0 } }
      .bar { fill: url(#bar); animation: grow 3s ease-out infinite alternate; transform-origin: 28px 0; }
      @keyframes grow { from { transform: scaleX(.55) } to { transform: scaleX(1) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="4.5" y="4.5" width="411" height="227" rx="18" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text class="name" x="28" y="46">VC370</text>
  
  <text class="tagline" x="28" y="70">Assembler and emulator</text>
  <rect class="bar" x="28" y="82" width="36" height="4" rx="2"/>
  <text class="about" x="28" y="112">Two-pass assembler and emulator for a 13-opcode</text><text class="about" x="28" y="133">simulated computer, with assemble-time and runtime</text><text class="about" x="28" y="154">error checks.</text>
  <rect class="tag" x="28" y="186" width="58" height="26" rx="13"/><text class="tagtext" x="57" y="203.5" text-anchor="middle">C++17</text><rect class="tag" x="94" y="186" width="50" height="26" rx="13"/><text class="tagtext" x="119" y="203.5" text-anchor="middle">Make</text>
</svg>
