<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 211 58" width="211" height="58" role="img" aria-label="Try Canoga Game, live">
  <title>Try Canoga Game</title>
  <defs>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glassSpec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glassShadow" x="-50%" y="-50%" width="200%" height="250%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <mask id="glassOutside" maskUnits="userSpaceOnUse" x="-5000" y="-5000" width="10000" height="10000">
      <rect x="-5000" y="-5000" width="10000" height="10000" fill="#FFF"/>
      <rect x="8" y="6" width="195" height="36" rx="18" fill="#000"/>
    </mask>
    <clipPath id="glassClip"><rect x="8" y="6" width="195" height="36" rx="18"/></clipPath>
    <style>
      .sheen { animation: sheen 9s ease-in-out infinite; animation-delay: 4.5s; }
      @keyframes sheen { 0%, 55% { transform: translateX(-195px) } 100% { transform: translateX(195px) } }
      .label { font: 600 15px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #121212; }
      .arrow { font: 600 15px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #16A34A; }
      .dot { fill: #16A34A; }
      .ping { fill: #16A34A; transform-origin: 30px 24px; animation: ping 1.8s ease-out infinite; }
      @keyframes ping { from { transform: scale(1); opacity: .6 } to { transform: scale(2.6); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="8" y="10" width="195" height="36" rx="18" fill="#000" fill-opacity="0.12" filter="url(#glassShadow)" mask="url(#glassOutside)"/>
  <rect x="8" y="6" width="195" height="36" rx="18" fill="url(#glassFill)"/>
  <g clip-path="url(#glassClip)"><rect class="sheen" x="8" y="6" width="195" height="36" fill="url(#glassSheen)"/></g>
  <circle class="ping" cx="30" cy="24" r="4.5"/><circle class="dot" cx="30" cy="24" r="4.5"/>
  <text class="label" x="44" y="29.5">Try Canoga Game</text>
  <text class="arrow" x="177" y="29.5">↗</text>
  <rect x="8.5" y="6.5" width="194" height="35" rx="18" fill="none" stroke="url(#glassEdge)"/>
  <rect x="26" y="6.5" width="159" height="1" fill="url(#glassSpec)"/>
</svg>
