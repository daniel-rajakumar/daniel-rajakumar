<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .beam { animation: sweep 4s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-1200px) } 100% { transform: translateX(1200px) } }
      @media (prefers-reduced-motion: reduce) { .beam { animation: none; } }
    </style>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="#B7C3F2" opacity="0.5"/>
  <g class="beam">
    <rect x="0" y="9" width="1200" height="6" fill="url(#g)" filter="url(#glow)"/>
    <rect x="0" y="11" width="1200" height="2" fill="url(#g)"/>
  </g>
</svg>
