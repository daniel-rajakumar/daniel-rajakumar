<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Daniel Rajakumar, software engineer">
  <title>Daniel Rajakumar</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F7FF"/><stop offset="1" stop-color="#E6ECFF"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2"><animate attributeName="stop-color" dur="6s" repeatCount="indefinite" values="#0891B2;#7C3AED;#DB2777;#0891B2"/></stop>
      <stop offset="0.5" stop-color="#7C3AED"><animate attributeName="stop-color" dur="6s" repeatCount="indefinite" values="#7C3AED;#DB2777;#0891B2;#7C3AED"/></stop>
      <stop offset="1" stop-color="#DB2777"><animate attributeName="stop-color" dur="6s" repeatCount="indefinite" values="#DB2777;#0891B2;#7C3AED;#DB2777"/></stop>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6ECFF" stop-opacity="1"/><stop offset="0.35" stop-color="#E6ECFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="400" rx="24"/></clipPath>
    <style>
      .star { fill: #0B1020; animation: twinkle ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
      .grid line { stroke: #B7C3F2; stroke-width: 1; }
      .floor { animation: roll 1.6s linear infinite; }
      @keyframes roll { from { transform: translateY(0) } to { transform: translateY(14px) } }
      .name { font: 800 68px 'SF Pro Display','Segoe UI',Inter,Helvetica,Arial,sans-serif; letter-spacing: 6px; fill: url(#name); }
      .hello { font: 600 22px 'SF Mono',Menlo,Consolas,monospace; fill: #4B5A8C; letter-spacing: 4px; }
      .role { font: 500 28px 'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #0B1020; }
      .prompt { font: 500 28px 'SF Mono',Menlo,Consolas,monospace; fill: #0891B2; }
      .cursor { fill: #0891B2; }
      .pill { fill: #FFFFFF; stroke: #B7C3F2; }
      .pilltext { font: 600 16px 'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif; fill: #0B1020; }
      .dot { fill: #059669; }
      .ping { fill: #059669; transform-origin: 46px 330px; animation: ping 1.8s ease-out infinite; }
      @keyframes ping { from { transform: scale(1); opacity: .7 } to { transform: scale(3); opacity: 0 } }
      .scan { fill: #0891B2; opacity: .07; animation: scan 5s linear infinite; }
      @keyframes scan { from { transform: translateY(-60px) } to { transform: translateY(420px) } }
      .ring { fill: none; stroke: #0891B2; stroke-opacity: .35; stroke-dasharray: 4 10; transform-origin: 1060px 150px; animation: spin 24s linear infinite; }
      .ring2 { fill: none; stroke: #DB2777; stroke-opacity: .3; stroke-dasharray: 2 8; transform-origin: 1060px 150px; animation: spin 16s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .orb { fill: #7C3AED; filter: url(#glow); animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
