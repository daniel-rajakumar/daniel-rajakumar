<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Daniel Rajakumar, software engineer">
  <title>Daniel Rajakumar</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#16A34A" stop-opacity="0.16"/><stop offset="1" stop-color="#16A34A" stop-opacity="0"/>
    </radialGradient>
    <!-- Fades the grid out toward the text without painting a background color. -->
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/><stop offset="0.45" stop-color="#FFF"/>
    </linearGradient>
    <mask id="fade"><rect x="16" y="10" width="1168" height="372" fill="url(#fadeL)"/></mask>
    <clipPath id="inner"><rect x="16" y="10" width="1168" height="372" rx="24"/></clipPath>
    <filter id="blob" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glassSpec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glassShadow" x="-50%" y="-50%" width="200%" height="250%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <mask id="glassOutside" maskUnits="userSpaceOnUse" x="-5000" y="-5000" width="10000" height="10000">
      <rect x="-5000" y="-5000" width="10000" height="10000" fill="#FFF"/>
      <rect x="16" y="10" width="1168" height="372" rx="24" fill="#000"/>
    </mask>
    <clipPath id="glassClip"><rect x="16" y="10" width="1168" height="372" rx="24"/></clipPath>
    <style>
      .grid line { stroke: #16A34A; stroke-opacity: 0.25; stroke-width: 1; }
      .floor { animation: roll 1.8s linear infinite; }
      @keyframes roll { from { transform: translateY(0) } to { transform: translateY(12px) } }
      .glow { animation: breathe 6s ease-in-out infinite; transform-origin: 900px 260px; }
      @keyframes breathe { 0%,100% { opacity: .75; transform: scale(1) } 50% { opacity: 1; transform: scale(1.06) } }
      .drift { animation: drift 14s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translate(0, 0) } to { transform: translate(140px, -40px) } }
      .sheen { animation: sheen 9s ease-in-out infinite; animation-delay: 0s; }
      @keyframes sheen { 0%, 55% { transform: translateX(-1168px) } 100% { transform: translateX(1168px) } }
      .hello { font: 500 18px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #71717A; letter-spacing: 3px; }
      .name { font: 600 60px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #121212; letter-spacing: .5px; }
      .bar { fill: url(#bar); animation: grow 3s ease-out infinite alternate; transform-origin: 64px 0; }
      @keyframes grow { from { transform: scaleX(.55) } to { transform: scaleX(1) } }
      .role { font: 400 26px 'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #3F3F46; }
      .prompt { font: 600 26px 'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #16A34A; }
      .cursor { fill: #16A34A; }
      .pill { fill: #16A34A; fill-opacity: .08; stroke: #16A34A; stroke-opacity: .45; }
      .pilltext { font: 500 15px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #16A34A; }
      .status { fill: #000000; fill-opacity: 0.032; stroke: #000000; stroke-opacity: 0.1; }
      .statustext { font: 500 15px Poppins,'Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif; fill: #3F3F46; }
      .dot { fill: #16A34A; }
      .ping { fill: #16A34A; transform-origin: 86px 318px; animation: ping 1.8s ease-out infinite; }
      @keyframes ping { from { transform: scale(1); opacity: .6 } to { transform: scale(2.8); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>


  <rect x="16" y="14" width="1168" height="372" rx="24" fill="#000" fill-opacity="0.12" filter="url(#glassShadow)" mask="url(#glassOutside)"/>
  <rect x="16" y="10" width="1168" height="372" rx="24" fill="url(#glassFill)"/>
  <g clip-path="url(#glassClip)"><rect class="sheen" x="16" y="10" width="1168" height="372" fill="url(#glassSheen)"/></g>
  <g clip-path="url(#inner)">
    <circle class="drift" cx="240" cy="330" r="130" fill="#16A34A" fill-opacity="0.064" filter="url(#blob)"/>
  </g>
  <g clip-path="url(#inner)" mask="url(#fade)">
    <circle class="glow" cx="900" cy="260" r="230" fill="url(#sun)"/>
    <g class="grid"><g class="floor"><line x1="560" y1="261.4" x2="1180" y2="261.4"/><line x1="560" y1="265.6" x2="1180" y2="265.6"/><line x1="560" y1="272.6" x2="1180" y2="272.6"/><line x1="560" y1="282.4" x2="1180" y2="282.4"/><line x1="560" y1="295.0" x2="1180" y2="295.0"/><line x1="560" y1="310.4" x2="1180" y2="310.4"/><line x1="560" y1="328.6" x2="1180" y2="328.6"/><line x1="560" y1="349.6" x2="1180" y2="349.6"/><line x1="560" y1="373.4" x2="1180" y2="373.4"/><line x1="560" y1="400.0" x2="1180" y2="400.0"/><line x1="560" y1="429.4" x2="1180" y2="429.4"/><line x1="900" y1="260" x2="90" y2="440"/><line x1="900" y1="260" x2="180" y2="440"/><line x1="900" y1="260" x2="270" y2="440"/><line x1="900" y1="260" x2="360" y2="440"/><line x1="900" y1="260" x2="450" y2="440"/><line x1="900" y1="260" x2="540" y2="440"/><line x1="900" y1="260" x2="630" y2="440"/><line x1="900" y1="260" x2="720" y2="440"/><line x1="900" y1="260" x2="810" y2="440"/><line x1="900" y1="260" x2="900" y2="440"/><line x1="900" y1="260" x2="990" y2="440"/><line x1="900" y1="260" x2="1080" y2="440"/><line x1="900" y1="260" x2="1170" y2="440"/><line x1="900" y1="260" x2="1260" y2="440"/><line x1="900" y1="260" x2="1350" y2="440"/><line x1="900" y1="260" x2="1440" y2="440"/><line x1="900" y1="260" x2="1530" y2="440"/><line x1="900" y1="260" x2="1620" y2="440"/><line x1="900" y1="260" x2="1710" y2="440"/></g></g>
  </g>

  <text class="hello" x="64" y="92">HI, I'M</text>
  <text class="name" x="62" y="160">Daniel Rajakumar</text>
  <rect class="bar" x="64" y="180" width="64" height="6" rx="3"/>

  <g transform="translate(64 246)">
    <text class="prompt" x="0" y="0">&gt;</text>
    <g transform="translate(30 0)">
    <clipPath id="clip0"><rect x="0" y="-40" height="60" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.0750;0.1875;0.2250;0.2500;1.0000" values="0;269.2;269.2;0;0;0"/>
    </rect></clipPath>
    <g clip-path="url(#clip0)"><text class="role" x="0" y="0">Software Engineer</text></g>
    <rect class="cursor" x="0" y="-23" width="3" height="29" opacity="0">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.0750;0.1875;0.2250;0.2500;1.0000" values="0;269.2;269.2;0;0;0"/>
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.0000;0.2500" values="0;1;0"/>
    </rect>
    <clipPath id="clip1"><rect x="0" y="-40" height="60" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.2500;0.3250;0.4375;0.4750;0.5000;1.0000" values="0;0;269.2;269.2;0;0;0"/>
    </rect></clipPath>
    <g clip-path="url(#clip1)"><text class="role" x="0" y="0">Building RockyGPT</text></g>
    <rect class="cursor" x="0" y="-23" width="3" height="29" opacity="0">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.2500;0.3250;0.4375;0.4750;0.5000;1.0000" values="0;0;269.2;269.2;0;0;0"/>
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.2500;0.5000" values="0;1;0"/>
    </rect>
    <clipPath id="clip2"><rect x="0" y="-40" height="60" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.5000;0.5750;0.6875;0.7250;0.7500;1.0000" values="0;0;394.0;394.0;0;0;0"/>
    </rect></clipPath>
    <g clip-path="url(#clip2)"><text class="role" x="0" y="0">Retrieval systems + evals</text></g>
    <rect class="cursor" x="0" y="-23" width="3" height="29" opacity="0">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.5000;0.5750;0.6875;0.7250;0.7500;1.0000" values="0;0;394.0;394.0;0;0;0"/>
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.5000;0.7500" values="0;1;0"/>
    </rect>
    <clipPath id="clip3"><rect x="0" y="-40" height="60" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.7500;0.8250;0.9375;0.9750;1.0000" values="0;0;456.4;456.4;0;0"/>
    </rect></clipPath>
    <g clip-path="url(#clip3)"><text class="role" x="0" y="0">Next.js · TypeScript · Python</text></g>
    <rect class="cursor" x="0" y="-23" width="3" height="29" opacity="0">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        keyTimes="0.0000;0.7500;0.8250;0.9375;0.9750;1.0000" values="0;0;456.4;456.4;0;0"/>
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.7500;1.0000" values="0;1;0"/>
    </rect>
    </g>
  </g>

  <rect class="pill" x="64" y="298" width="296" height="40" rx="20"/>
  <circle class="ping" cx="86" cy="318" r="5"/>
  <circle class="dot" cx="86" cy="318" r="5"/>
  <text class="pilltext" x="102" y="323">Open to New Grad SWE Roles</text>

  <rect class="status" x="376" y="298" width="296" height="40" rx="20"/>
  <text class="statustext" x="394" y="323">⚡ 5 PM in NJ · building RockyGPT</text>

  <rect x="16.5" y="10.5" width="1167" height="371" rx="24" fill="none" stroke="url(#glassEdge)"/>
  <rect x="40" y="10.5" width="1120" height="1" fill="url(#glassSpec)"/>
</svg>
