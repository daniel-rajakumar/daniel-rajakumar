# Redraws the banner every hour so its status pill shows the current time in
# New Jersey, e.g. "☀️ 10 AM in NJ · shipping".
name: NJ time status

on:
  schedule:
    - cron: "2 * * * *" # a couple of minutes past every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency: profile-push

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redraw the banner and cards
        run: python3 scripts/make_art.py

      - name: Commit the new banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "Update NJ time status"
          git pull --rebase
          git push
