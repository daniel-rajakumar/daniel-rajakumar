# Regenerates the snake that eats the contribution graph in the profile
# README. Runs daily and on demand.
name: Profile art

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            generated/snake-dark.svg?palette=github-dark&color_snake=#1DB954&color_dots=#202022,#0E4429,#006D32,#1DB954,#39D353
            generated/snake-light.svg?palette=github-light&color_snake=#16A34A&color_dots=#EBEDF0,#9BE9A8,#40C463,#30A14E,#216E39

      - name: Commit the new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git diff --cached --quiet || git commit -m "Update profile art"
          git push
