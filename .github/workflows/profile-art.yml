# Regenerates the snake that eats the contribution graph in the profile
# README. Runs daily and on demand.
name: Profile art

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            generated/snake-dark.svg?palette=github-dark&color_snake=#F0FFF4&color_dots=#3A3F47,#1B6B3A,#16A34A,#1DB954,#86EFAC
            generated/snake-light.svg?palette=github-light&color_snake=#121212&color_dots=#E4E7EB,#A7F3C5,#4ADE80,#16A34A,#166534

      # snk runs in a container, so its files belong to root.
      - name: Remove the score bar under the snake
        run: sudo python3 scripts/trim_snake.py generated/snake-dark.svg generated/snake-light.svg

      - name: Commit the new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git diff --cached --quiet || git commit -m "Update profile art"
          git push
